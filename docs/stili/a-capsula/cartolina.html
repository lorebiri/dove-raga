<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Cartolina A</title>
<style>
@font-face{font-family:"Lilita One";src:url(../fonts/lilita-one.woff2) format("woff2")}
@font-face{font-family:"Rubik";src:url(../fonts/rubik-var.woff2) format("woff2");font-weight:300 900}
html,body{margin:0}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;background:#1E0B4B radial-gradient(circle at 80% 10%,#3A1C8C 0,transparent 50%);color:#FFF6E0;font-family:"Rubik",sans-serif}
.brand{position:absolute;left:80px;top:90px;display:flex;align-items:center;gap:22px;font-family:"Lilita One";font-size:64px}
.brand img{width:110px}
.bub{position:absolute;left:80px;right:80px;top:270px;background:#FFF6E0;color:#1E0B4B;font-weight:700;font-size:46px;padding:26px 36px;border-radius:44px 44px 44px 12px}
.ball{position:absolute;left:50%;top:430px;transform:translateX(-50%);width:640px}
.lbl{position:absolute;left:80px;top:1120px;font-family:"Lilita One";font-size:52px;color:#C8FF2E;letter-spacing:.04em}
.name{position:absolute;left:80px;right:80px;top:1190px;font-family:"Lilita One";font-size:150px;line-height:.95;text-shadow:0 10px 0 #FF3D9A,0 20px 0 #12052E}
.tags{position:absolute;left:80px;top:1520px;display:flex;gap:20px}
.tag{font-weight:800;font-size:44px;padding:14px 30px;border-radius:999px;border:5px solid #12052E;color:#1E0B4B}
.cta{position:absolute;left:80px;right:80px;bottom:110px;background:#C8FF2E;color:#1E0B4B;border:7px solid #12052E;border-radius:40px;padding:26px 40px;box-shadow:0 12px 0 #12052E}
.cta b{font-family:"Lilita One";font-weight:400;font-size:58px;display:block}
.cta span{font-weight:800;font-size:40px}
.osm{position:absolute;right:80px;bottom:40px;font-size:24px;color:#BBA9EE}
</style></head><body><div class="c">
<div class="brand"><img src="simbolo.svg" alt="">dove raga?</div>
<div class="bub">nessuno decideva. ha deciso la macchinetta 🙃</div>
<img class="ball" src="simbolo.svg" alt="">
<div class="lbl">CI È USCITO ✦</div>
<div class="name">Kawa Sushi Lab</div>
<div class="tags"><span class="tag" style="background:#2EE6FF">📍 a 1,2 km</span><span class="tag" style="background:#FF8CC6">🍣 sushi</span></div>
<div class="cta"><b>gira anche tu →</b><span>lorebiri.github.io/dove-raga</span></div>
<div class="osm">Dati © contributori OpenStreetMap</div>
</div></body></html>
