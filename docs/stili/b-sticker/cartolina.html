<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Cartolina B</title>
<style>
@font-face{font-family:"Bricolage";src:url(../fonts/bricolage-800.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Rubik";src:url(../fonts/rubik-var.woff2) format("woff2");font-weight:300 900}
html,body{margin:0}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;background:#FFE600;color:#121212;font-family:"Rubik",sans-serif;
  background-image:radial-gradient(rgba(0,0,0,.08) 4px,transparent 4.5px);background-size:48px 48px}
.st{position:absolute;background:#fff;border:8px solid #121212;border-radius:44px;box-shadow:16px 16px 0 #121212}
.top{left:70px;top:90px;padding:18px 34px;font-family:"Bricolage";font-weight:800;font-size:70px;letter-spacing:-.04em;transform:rotate(-3deg)}
.msg{left:auto;right:70px;top:270px;background:#2B4BFF;color:#fff;font-weight:700;font-size:46px;padding:24px 36px;border-radius:44px 44px 10px 44px;transform:rotate(2deg)}
.nig{position:absolute;left:250px;top:400px;width:580px;transform:rotate(4deg)}
.res{left:70px;right:70px;top:1010px;padding:44px 50px;transform:rotate(-2deg)}
.res .lbl{display:inline-block;background:#121212;color:#FFE600;font-weight:800;font-size:38px;letter-spacing:.06em;text-transform:uppercase;padding:8px 18px;border-radius:12px}
.res .name{font-family:"Bricolage";font-weight:800;font-size:132px;line-height:.9;letter-spacing:-.05em;margin-top:24px}
.km{left:90px;top:1480px;background:#00D68F;padding:16px 34px;font-weight:800;font-size:50px;transform:rotate(3deg)}
.kind{left:520px;top:1490px;background:#FF5A36;color:#fff;padding:16px 34px;font-weight:800;font-size:50px;transform:rotate(-4deg)}
.cta{left:70px;right:70px;bottom:110px;padding:28px 44px;background:#121212;color:#FFE600;box-shadow:16px 16px 0 #FF5A36}
.cta b{font-family:"Bricolage";font-weight:800;font-size:62px;letter-spacing:-.03em;display:block}
.cta span{font-weight:700;font-size:40px;color:#fff}
.osm{position:absolute;right:80px;bottom:40px;font-size:24px;color:#3d3600}
</style></head><body><div class="c">
<div class="st top">dove raga?</div>
<div class="st msg">deciso. non si discute 🤝</div>
<img class="nig" src="simbolo.svg" alt="">
<div class="st res"><span class="lbl">il dado ha deciso</span><div class="name">Kawa Sushi Lab</div></div>
<div class="st km">📍 a 1,2 km</div>
<div class="st kind">🍣 sushi</div>
<div class="st cta"><b>tira anche tu →</b><span>lorebiri.github.io/dove-raga</span></div>
<div class="osm">Dati © contributori OpenStreetMap</div>
</div></body></html>
